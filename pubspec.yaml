name: examgo
description: "ExamGO — Secure Exam Browser for Android & iOS"
publish_to: 'none'

version: 2.1.0+14

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^8.0.2

  # QR Scanner & Generator
  mobile_scanner: ^7.1.3
  qr_flutter: ^4.1.0

  # WebView — tambahan wkwebview untuk iOS
  webview_flutter: ^4.13.0
  webview_flutter_wkwebview: ^3.20.0    # iOS WKWebView
  webview_flutter_android: ^4.10.11       # Android WebView (pastikan sinkron)

  # Permissions
  permission_handler: ^12.0.1

  # Gallery (pick QR image)
  image_picker: ^1.2.1

  # Device info (Android SDK version check)
  device_info_plus: ^12.3.0

  # Connectivity
  connectivity_plus: ^7.0.0

  # Local storage
  shared_preferences: ^2.2.2

  # Cryptography — QR signing (HMAC-SHA256)
  crypto: ^3.0.5

  # HTTP
  http: ^1.1.0

  # Save QR image to temp + share
  path_provider: ^2.1.4
  share_plus: ^12.0.1
  url_launcher: ^6.3.1        # Open APK download link

  # Firebase
  firebase_core: ^4.5.0
  firebase_analytics: ^12.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true