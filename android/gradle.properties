# FIX: Sebelumnya ada 2 baris org.gradle.jvmargs — baris kedua (-Xmx4g) menimpa
# baris pertama (-Xmx8G), sehingga Gradle hanya mendapat 4GB heap.
# Digabung menjadi satu baris dengan semua flag yang diperlukan.
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# Aktifkan Gradle build cache dan parallel execution untuk build lebih cepat
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configureondemand=true