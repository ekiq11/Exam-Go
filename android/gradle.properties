# FIX: Sebelumnya ada 2 baris org.gradle.jvmargs — baris kedua (-Xmx4g) menimpa
# baris pertama (-Xmx8G), sehingga Gradle hanya mendapat 4GB heap.
# Digabung menjadi satu baris dengan semua flag yang diperlukan.
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# Aktifkan Gradle build cache dan parallel execution untuk build lebih cepat
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configureondemand=true

# FIX PLAY-16KB: Wajib agar native .so libs tidak dikompres di dalam AAB.
# Tanpa ini, system linker Android 15+ tidak bisa membaca library dengan
# page alignment 16KB → Play Store menolak upload dengan error "16 KB page size".
android.bundle.enableUncompressedNativeLibs=true

# FIX WINDOWS CROSS-DRIVE KOTLIN BUILD ERROR:
# Kotlin incremental compilation gagal di Windows ketika project (D:\) dan
# Pub/Gradle cache (C:\Users\...) berada di drive berbeda.
# Error: "IllegalArgumentException: this and base files have different roots"
# Root cause: Kotlin compiler mencoba membuat relative path lintas drive — tidak
# mungkin di Windows (C:\ dan D:\ tidak punya common root).
# Fix: Nonaktifkan Kotlin incremental compilation. Build menjadi sedikit lebih
# lambat tapi stabil. Tidak mempengaruhi output APK/AAB sama sekali.
kotlin.incremental=false
kotlin.incremental.java=false
kotlin.incremental.js=false

# Daemon Kotlin compiler heap — tambah sedikit karena tanpa incremental,
# seluruh codebase dikompilasi sekaligus dalam satu JVM session.
kotlin.daemon.jvm.options=-Xmx4G -XX:MaxMetaspaceSize=1G